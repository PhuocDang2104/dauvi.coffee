[project]
name = "dau-vi-api"
version = "0.1.0"
description = "DẤU VỊ catalog, traceability, advisor and demo-order API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

