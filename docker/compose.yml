name: dau-vi

services:
  database:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dauvi}
      POSTGRES_USER: ${POSTGRES_USER:-dauvi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb

  backend:
    container_name: dauvi-api
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dauvi}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-dauvi}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in docker/.env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in docker/.env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-dauvi_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      SESSION_REMEMBER_DAYS: ${SESSION_REMEMBER_DAYS:-30}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-8}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}
      ASSISTANT_RATE_LIMIT_REQUESTS: ${ASSISTANT_RATE_LIMIT_REQUESTS:-12}
      ASSISTANT_RATE_LIMIT_WINDOW_MINUTES: ${ASSISTANT_RATE_LIMIT_WINDOW_MINUTES:-1}
      AI_ENABLED: ${AI_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-low}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-20}
      GROQ_MAX_OUTPUT_TOKENS: ${GROQ_MAX_OUTPUT_TOKENS:-800}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-18081}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - app
      - data
    security_opt:
      - no-new-privileges:true

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
